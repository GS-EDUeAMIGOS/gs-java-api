spring:
  application:
    name: viacidada-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}
  cache:
    type: simple
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

viacidada:
  security:
    jwt:
      secret: ${JWT_SECRET:dmlhY2lkYWRhLsecret-key-global-solution-fiap-2026-citizentech-256bits}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:https://viacidada-3a46802b7054.eastus.cloudapp.azure.com,http://localhost:*,https://localhost:*,http://127.0.0.1:*,https://127.0.0.1:*}
  openapi:
    azure-url: ${OPENAPI_AZURE_URL:https://viacidada-3a46802b7054.eastus.cloudapp.azure.com}
    local-url: ${OPENAPI_LOCAL_URL:http://localhost:8080}
  sptrans:
    base-url: ${SPTRANS_BASE_URL:https://api.olhovivo.sptrans.com.br/v2.1}
    token: ${SPTRANS_TOKEN:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,caches
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: ViaCidada API
    description: API RESTful CitizenTech para mobilidade urbana acessivel e integracao SPTrans Olho Vivo
    version: 1.0.0
